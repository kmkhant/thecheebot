[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheebot"
version = "0.1.0"
description = "A free Telegram bot for finding, viewing and sharing public toilet locations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot>=21.6,<23", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-xdist>=3.6", "ruff>=0.6"]

[project.scripts]
cheebot = "cheebot.__main__:main"

[tool.setuptools.packages.find]
include = ["cheebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
